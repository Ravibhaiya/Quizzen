name: CI

# Runs on pull requests only (main only ever changes through a pull request, so a second run after the merge would just repeat
# the same work). Skipped when only documentation changed. APKs are NOT built here, see apk.yml.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Check generated logo drawables are in sync with design/quizzen-logo.svg
        run: |
          python3 tools/generate_logo_drawables.py
          git diff --exit-code -- app/src/main/res/drawable app/src/main/res/values/logo_colors.xml

      - name: Unit tests, lint and debug build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
